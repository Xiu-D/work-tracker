<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="打工記帳與收入計算 — 輕鬆追蹤您的打工收入與出勤紀錄" />
  <title>打工記帳 — 收入計算器</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WorkTracker" />
  <meta name="theme-color" content="#2563EB" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Loading Overlay ===== -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <p class="loading-text">載入中⋯</p>
  </div>

  <!-- ===== Login Screen ===== -->
  <div id="loginScreen" class="login-screen" style="display:none;">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">💰</div>
        <h1 class="login-title">打工記帳</h1>
        <p class="login-subtitle">登入以同步您的打工紀錄</p>
      </div>

      <form id="loginForm" novalidate onsubmit="return false;">
        <div class="auth-field">
          <label for="authEmail">電子郵件</label>
          <input type="email" id="authEmail" placeholder="your@email.com" required autocomplete="email" />
        </div>
        <div class="auth-field">
          <label for="authPassword">密碼</label>
          <input type="password" id="authPassword" placeholder="至少 6 個字元" required autocomplete="current-password" />
        </div>

        <div id="authError" class="auth-error" style="display:none;"></div>

        <button type="button" class="btn btn-primary auth-btn" id="loginBtn">
          登入
        </button>
        <button type="button" class="btn auth-btn auth-btn-outline" id="signupBtn">
          建立新帳號
        </button>
      </form>

      <div class="auth-divider">
        <span>或</span>
      </div>

      <button type="button" class="btn auth-btn google-btn" id="googleLoginBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" class="google-icon">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        使用 Google 帳號登入
      </button>
    </div>
  </div>

  <!-- ===== User Bar ===== -->
  <div id="userBar" class="user-bar" style="display:none;">
    <div class="user-bar-inner">
      <div class="user-info">
        <span class="user-avatar">👤</span>
        <span class="user-email" id="userEmail"></span>
      </div>
      <button class="btn-logout" id="logoutBtn" title="登出">登出</button>
    </div>
  </div>

  <!-- ===== Main App ===== -->
  <div id="mainApp" style="display:none;">
    <div id="app">
      <!-- ===== 頂部總覽儀表板 ===== -->
      <section id="dashboard" class="card dashboard-card">
        <h1 class="dashboard-title">打工記帳</h1>
        <p class="dashboard-subtitle">收入總覽</p>
        <div class="month-nav">
          <button class="month-arrow" id="prevMonth" title="上個月">‹</button>
          <button class="month-label" id="monthLabel" title="回到本月"></button>
          <button class="month-arrow" id="nextMonth" title="下個月">›</button>
        </div>
        <div class="date-range">
          <div class="date-field">
            <label for="startDate">起始日期</label>
            <input type="date" id="startDate" />
          </div>
          <span class="date-separator">—</span>
          <div class="date-field">
            <label for="endDate">結束日期</label>
            <input type="date" id="endDate" />
          </div>
        </div>
        <div class="total-income-wrapper">
          <span class="currency-symbol">NT$</span>
          <span id="totalIncome" class="total-income">0</span>
        </div>
        <p class="income-label">區間總收入</p>
      </section>

      <!-- ===== 新增工作表單 ===== -->
      <section id="addJobSection" class="card">
        <h2 class="section-title">
          <span class="section-icon">💼</span>
          新增工作
        </h2>
        <form id="addJobForm" novalidate>
          <div class="form-group">
            <label for="jobName">工作名稱</label>
            <input type="text" id="jobName" placeholder="例如：便利商店" required />
          </div>
          <div class="form-row">
            <div class="form-group flex-1">
              <label for="jobType">計薪方式</label>
              <div class="select-wrapper">
                <select id="jobType">
                  <option value="hourly">時薪制</option>
                  <option value="fixed">按次固定制</option>
                </select>
              </div>
            </div>
            <div class="form-group flex-1">
              <label for="jobRate">金額 (NT$)</label>
              <input type="number" id="jobRate" placeholder="0" min="0" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="addJobBtn">
            <span class="btn-icon">＋</span> 新增工作
          </button>
        </form>
      </section>

      <!-- ===== 記錄出勤表單 ===== -->
      <section id="addRecordSection" class="card">
        <h2 class="section-title">
          <span class="section-icon">📝</span>
          記錄出勤
        </h2>
        <form id="addRecordForm" novalidate>
          <div class="form-group">
            <label for="recordJob">選擇工作</label>
            <div class="select-wrapper">
              <select id="recordJob">
                <option value="" disabled selected>請選擇工作</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group flex-1">
              <label for="recordDate">日期</label>
              <input type="date" id="recordDate" required />
            </div>
            <div class="form-group flex-1">
              <label for="recordUnits" id="recordUnitsLabel">時數</label>
              <input type="number" id="recordUnits" placeholder="0" min="0" step="0.5" required />
            </div>
          </div>
          <button type="submit" class="btn btn-secondary" id="addRecordBtn">
            <span class="btn-icon">＋</span> 新增紀錄
          </button>
        </form>
      </section>

      <!-- ===== 工作清單與歷史紀錄 ===== -->
      <section id="jobListSection">
        <h2 class="section-title standalone-title">
          <span class="section-icon">📋</span>
          工作清單與歷史紀錄
        </h2>
        <div id="jobList" class="job-list">
          <!-- 動態生成 -->
        </div>
        <div id="emptyState" class="empty-state" style="display:none;">
          <div class="empty-icon">🗂️</div>
          <p>尚未建立任何工作</p>
          <p class="empty-hint">請在上方新增您的第一份工作吧！</p>
        </div>
      </section>
    </div>
  </div>

  <!-- 確認對話框 -->
  <div id="confirmOverlay" class="confirm-overlay" style="display:none;">
    <div class="confirm-dialog">
      <div class="confirm-icon" id="confirmIcon">⚠️</div>
      <p class="confirm-message" id="confirmMessage"></p>
      <p class="confirm-sub" id="confirmSub"></p>
      <div class="confirm-actions">
        <button class="confirm-btn confirm-cancel" id="confirmCancel">取消</button>
        <button class="confirm-btn confirm-delete" id="confirmDelete">刪除</button>
      </div>
    </div>
  </div>

  <!-- Toast 通知 -->
  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
